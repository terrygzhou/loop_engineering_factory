# Markdownlint config for Super-Linter's MARKDOWN_LINTER job.
#
# Kept permissive on purpose: the 35 SKILL.md files are authored as
# natural-language agent instructions, and aggressive structural rules
# (blank-line bookkeeping, heading increment, list-style, table
# alignment) would turn the gate into a format police rather than a
# quality gate. The rules below are the only ones we enforce:
#   - MD001/MD003/MD004/MD014/MD019/MD023/MD025/MD026/MD029/MD033/
#     MD035/MD041/MD046/MD049/MD050/MD051/MD052/MD053/MD055/MD056/
#     MD058/MD060 (the "default: true" set minus the structural rules
#     below)
#
# The 35 SKILL.md files are generated/curated by the agent pipeline;
# re-running `markdownlint --fix` is not part of the workflow, so any
# rule that requires a mechanical fix rather than a human edit is
# disabled here.
default: true

# SKILL.md files are mixed prose + fenced code blocks + YAML front-matter;
# line-length checks are noise, not signal.
line-length: false

# Trailing whitespace on a single line is cosmetic, not a quality issue.
trailing-spaces: false

# Structural / mechanical rules — disabled because the 35 SKILL.md
# files are agent-curated and a `--fix` pass is not part of the gate:
#   MD001 (heading-increment)
#   MD012 (multiple-blank-lines)
#   MD014 (multiple-hash-prefix)
#   MD022 (blanks-around-headings)
#   MD023 (heading-level)
#   MD024 (no-duplicate-heading)
#   MD030 (list-marker-space)
#   MD031 (blanks-around-fences)
#   MD032 (blanks-around-lists)
#   MD033 (no-inline-html)
#   MD034 (bare-urls)
#   MD036 (no-emphasis-as-heading)
#   MD037 (no-space-in-emphasis)
#   MD040 (fenced-code-language)
#   MD041 (first-line-heading)
#   MD047 (file-ends-with-newline)
#   MD050 (strong-style)
#   MD052 (reference-links)
#   MD056 (table-column-count)
#   MD058 (blanks-around-tables)
#   MD060 (table-column-count)
MD001: false
MD012: false
MD014: false
MD022: false
MD023: false
MD024: false
MD030: false
MD031: false
MD032: false
MD033: false
MD034: false
MD036: false
MD037: false
MD040: false
MD041: false
MD047: false
MD050: false
MD052: false
MD056: false
MD058: false
MD060: false
