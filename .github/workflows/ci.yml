name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check --output-format=github .

      - name: Run ruff formatter check
        run: ruff format --check .

  typecheck:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy types-PyYAML types-requests
          pip install -r requirements.txt --quiet 2>/dev/null || true

      - name: Run mypy
        run: mypy --ignore-missing-imports --no-error-summary=false graph/ config/ service/ frontend/

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r requirements.txt --quiet 2>/dev/null || true

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=graph --cov=config --cov=service --cov-report=term-missing --cov-report=xml

      - name: Check coverage threshold
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          try:
              root = ET.parse('coverage.xml').getroot()
              rate = float(root.get('line-rate', 0))
              pct = int(rate * 100)
              print(f'Coverage: {pct}%')
              if pct < 60:
                  print(f'::error::Coverage {pct}% below 60% threshold')
                  sys.exit(1)
          except Exception as e:
              print(f'::warning::Could not parse coverage.xml: {e}')
          "

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t loop-engineering:test .

      - name: Verify entrypoint exists
        run: |
          docker run --rm loop-engineering:test test -f /entrypoint.sh && echo "Entrypoint OK"
          docker run --rm loop-engineering:test test -f /app/requirements.txt && echo "App files OK"

  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        run: docker build -t loop-engineering:test .

      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: 'loop-engineering:test'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '0'

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, docker-build]
    if: always()
    steps:
      - name: Check all required jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::Quality gate failed - one or more required jobs did not pass"
          echo "Results:"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  typecheck: ${{ needs.typecheck.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          exit 1

      - name: Quality gate passed
        run: echo "All quality gates passed"
