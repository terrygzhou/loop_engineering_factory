services:
  # ─── Loop Engineering — unified container ──────────────────────
  loop:
    build: .
    ports:
      - "4080:80" # nginx — static frontend
      - "48011:8011" # uvicorn — FastAPI backend
      - "48081:8081" # health server — external health checks
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_BASE_URL=http://pop-os:8080/v1
      - CHROMA_URL=http://chromadb:8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_SERVICE_NAME=loop-orchestrator
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - OBSERVABILITY_PORT=8081
      - PYTHONPATH=/app
    volumes:
      - skills_data:/root/.hermes/skills
      - build_data:/app/build
      - skill_data:/app/skills
      - ./output:/app/output
      # Docker socket removed for security — use Docker API over TLS if needed
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
    depends_on:
      - chromadb
      - otel-collector
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "umask 0002 && mkdir -p /app/output && chown -R 1000:1000 /app/output 2>/dev/null || true && exec /entrypoint.sh",
      ]
    restart: unless-stopped
    networks:
      - loop_factory_network
      - loop_factory_default
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Data & Tooling ──────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    # Internal-only — no host port binding (port 8000 often in use)
    # Accessible via CHROMA_URL=http://chromadb:8000 inside container network
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - loop_factory_default
      - loop_factory_network
    deploy:
      resources:
        limits:
          memory: 512M
    # healthcheck: chromadb uses bash + /dev/tcp (no curl/wget in image)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Observability Stack ──

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector/config.yaml"]
    # No host port bindings — shares collector with other projects on 4317/4318
    # Use OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317/v1/traces
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector/config.yaml:ro
    restart: unless-stopped
    networks:
      - loop_factory_default
      - loop_factory_network
    deploy:
      resources:
        limits:
          memory: 256M
    # No healthcheck: distroless image has no shell for curl/wget/bash

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "46006:6006"
    environment:
      - PHOENIX_DATABASE_URI=/var/lib/phoenix/phoenix.db
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_COLLECTOR_OTLP_ENABLED=true
      - PHOENIX_COLLECTOR_HOST=0.0.0.0
      - PHOENIX_COLLECTOR_GRPC_PORT=4317
      - PHOENIX_COLLECTOR_HTTP_PORT=4318
    volumes:
      - phoenix_data:/var/lib/phoenix
    restart: "no"
    networks:
      - loop_factory_default
      - loop_factory_network
    deploy:
      resources:
        limits:
          memory: 1G
    # healthcheck: python3 exists in phoenix image; use urllib for HTTP check
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ── OpenHands: AI agent for Gateway API (OpenAI-compatible) ──
  openhands:
    image: ghcr.io/openhands/agent-server:main-python
    container_name: openhands-server
    restart: "unless-stopped"
    # main-python binds to 127.0.0.1 when no session API key is set (security
    # default), which breaks the host port-forward on :43005. Override the
    # entrypoint to bind all interfaces so the gateway is reachable from the
    # host (loop_factory-loop connects via the internal network anyway, but
    # host-side tooling / manual debugging also reach :43005).
    command: ["--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "43005:8000"
    volumes:
      - ~/.openhands:/.openhands
      # Docker socket removed — OpenHands sandbox uses its own network isolation
      - ./output:/opt/workspace_base/output
      # The gateway's CWD is /, and event_service resolves relative 'output/'
      # paths from CWD. Bind the shared volume to /output so
      # 'output/<project>' resolves without needing root inside the image.
      - ./output:/output
    environment:
      - LLM_BASE_URL=http://host.docker.internal:8080/v1
      - LLM_MODEL=Qwen3.8-27B
      - OH_SECRET_KEY=${OH_SECRET_KEY}
      - SANDBOX_USER_ID=1000
      - AGENT_SERVER_IMAGE_REPOSITORY=ghcr.io/openhands/agent-server
      - AGENT_SERVER_IMAGE_TAG=main-python
      - WORKSPACE_BASE=/opt/workspace_base
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "pop-os:host-gateway"
    depends_on:
      - loop
    networks:
      - loop_factory_network
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── OpenHands Agent Canvas: all-in-one UI (agent-server + automation + frontend) ──
  # The agent-canvas image bundles its OWN agent-server (port 18000 inside the
  # container) plus the automation backend (18001) and the static frontend, all
  # unified behind a single ingress on :8000 and exposed at /canvas. This is a
  # SEPARATE, independent agent-server from the headless `openhands` service
  # above (which the loop_factory BUILD node drives via REST). They do not share
  # conversation state; the canvas is the visible multi-agent dashboard / ACP
  # layer the headless gateway lacks. The canvas's own agent-server is reachable
  # from the host at :43100/api when you want to poke its REST API directly.
  canvas:
    image: ghcr.io/openhands/agent-canvas:main
    container_name: openhands-canvas
    restart: "unless-stopped"
    ports:
      - "43006:8000"   # unified ingress: /canvas (UI), /api, /api/automation, /vscode
    volumes:
      # Canvas's own agent-server persists here (separate from openhands-server's ~/.openhands).
      # The agent-canvas image declares /home/openhands/.openhands as a volume, so the bind
      # targets that exact path (not /.openhands, which the image also declares but doesn't
      # use as its config root). Host source must be owned by the container user (uid 1000).
      - ~/.openhands/canvas:/home/openhands/.openhands
      # Projects the canvas agent can read/edit
      - ./projects:/projects
      # Shared generated-output dir so the canvas agent can see loop builds
      - ./output:/output
    environment:
      # LLM — canvas's own agent-server needs the provider + key env that the
      # headless openhands service is missing (it relies on inline LLM config
      # from the BUILD node). Pointed at the local SGLang endpoint.
      - LLM_BASE_URL=http://host.docker.internal:8080/v1
      - LLM_MODEL=Qwen3.8-27B
      - LLM_API_KEY=not-needed
      - LLM_PROVIDER=openai
      # Session API key (secures /api and the automation backend; auto-generated
      # + persisted to the volume if unset). Provide your own to lock it down.
      - LOCAL_BACKEND_API_KEY=${LOCAL_BACKEND_API_KEY}
      - OH_SECRET_KEY=${OH_SECRET_KEY}
      # Disable telemetry to the OpenHands cloud (self-hosted)
      - VITE_DO_NOT_TRACK=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "pop-os:host-gateway"
    depends_on:
      - openhands
    networks:
      - loop_factory_network
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      # The ingress proxy serves the agent-server's /health on the unified port
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail.yaml:ro
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    # No host ports — internal-only, talks to Loki on grafana-stack network
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "perl",
          "-e",
          "use IO::Socket::INET; IO::Socket::INET->new(PeerAddr=>'localhost:9080') or exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - loop_factory_default
      - grafana-stack_observability

# Compose project name — promtail filters on "loop_factory-loop-1", so the
# project MUST be named loop_factory for the loop container's logs to reach
# Loki (W1). Without this, compose derives the name from the directory
# (loop_engineering_factory) and promtail matches nothing.
name: loop_factory

volumes:
  chroma_data:
  skills_data:
  phoenix_data:
  build_data:
  skill_data:

# Bridge to the existing Grafana observability stack (Loki, Prometheus, Grafana)
networks:
  loop_factory_default:
    driver: bridge
  loop_factory_network:
    driver: bridge
  grafana-stack_observability:
    external: true
